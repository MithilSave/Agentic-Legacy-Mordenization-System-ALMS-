# === Auto-Generated API Gateway (Nginx) ===
# Routes requests to backend microservices by path prefix

    upstream usermanagement {
        server usermanagement:8000;
    }
    upstream orderprocessing {
        server orderprocessing:8000;
    }
    upstream paymentprocessing {
        server paymentprocessing:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Gateway health check
        location /health {
            return 200 '{"status": "healthy", "service": "api-gateway"}';
            add_header Content-Type application/json;
        }

        # Service discovery — list all available services
        location /api {
            return 200 '{"services": ["usermanagement", "orderprocessing", "paymentprocessing"]}';
            add_header Content-Type application/json;
        }

        # usermanagement
        location /api/usermanagement {
            proxy_pass http://usermanagement;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # orderprocessing
        location /api/orderprocessing {
            proxy_pass http://orderprocessing;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
        # paymentprocessing
        location /api/paymentprocessing {
            proxy_pass http://paymentprocessing;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Frontend UI
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
