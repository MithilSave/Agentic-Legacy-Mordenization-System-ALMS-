services:
  app-service:
    build:
      context: ./app-service
      dockerfile: Dockerfile
    container_name: app-service
    expose:
    - '8000'
    environment:
      DATABASE_URL: sqlite:///./data/app.db
      SERVICE_NAME: app-service
      LOG_LEVEL: INFO
    volumes:
    - app-service-data:/app/data
    networks:
    - microservices
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - -c
      - import urllib.request; urllib.request.urlopen('http://localhost:8000/health')
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: '0.5'
        reservations:
          memory: 128M
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
